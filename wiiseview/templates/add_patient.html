<!DOCTYPE html>
<html>
<head>
  <title>Add New Patient</title>
  <style>
    body {
      background-color: #eef2f3;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #2ecc71;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #27ae60;
    }
    .message {
      margin-top: 10px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add New Patient</h2>
    <form method="POST">
      <label>Patient ID</label>
      <input type="text" name="patient_id" required title="Unique ID. Cannot be reused.">

      <label>Name</label>
      <input type="text" name="name" required title="Enter full name of the patient.">

      <label>Age</label>
      <input type="number" name="age" required min="0" max="120" title="Age in years. Must be between 0 and 120.">

      <label>Gender</label>
      <select name="gender" required>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label>Blood Pressure (Systolic / Diastolic)</label>
      <div style="display: flex; gap: 10px;">
        <input type="number" name="systolic" placeholder="Systolic" required min="70" max="200"
               title="Normal systolic BP: ~90-120 mmHg. Max 200.">
        <input type="number" name="diastolic" placeholder="Diastolic" required min="40" max="130"
               title="Normal diastolic BP: ~60-80 mmHg. Max 130.">
      </div>

      <label>BMI</label>
      <input type="number" step="0.1" name="bmi" required min="10" max="60"
             placeholder="e.g. weight(kg)/height(m)^2"
             title="Normal BMI: 18.5 to 24.9. Acceptable range: 10–60.">

      <label>Glucose Level (mg/dL)</label>
      <input type="number" name="glucose" required min="50" max="300"
             title="Normal fasting glucose: ~70-100 mg/dL. Acceptable range: 50–300.">

      <label>SpO2 (%)</label>
      <input type="number" name="spo2" required min="70" max="100"
             placeholder="Enter value between 70–100"
             title="SpO2 indicates oxygen level in blood. Normal: 95–100%. Minimum allowed: 70%.">

      <label>Pulse Rate (bpm)</label>
      <input type="number" name="pulse" required min="30" max="200"
             placeholder="Enter heart rate in bpm"
             title="Normal resting pulse: 60–100 bpm. Acceptable range: 30–200.">

      <label>Diabetes Risk (Outcome)</label>
      <select name="outcome" required title="0 = Normal, 1 = At Risk of Diabetes">
        <option value="0">Normal</option>
        <option value="1">At Risk</option>
      </select>

      <button type="submit">Add Patient</button>
    </form>

    {% if message %}
      <div class="message">{{ message }}</div>
    {% endif %}
  </div>
</body>
</html>
