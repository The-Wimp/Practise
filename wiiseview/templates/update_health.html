<!DOCTYPE html>
<html>
<head>
  <title>Update Health Data</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #eef2f3;
    }
    .container {
      max-width: 600px;
      margin-top: 50px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-label small {
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">🩺 Update Your Health Stats</h2>
    
    <form method="POST">
      <div class="row mb-3">
        <div class="col">
          <label class="form-label">Systolic BP <small>(upper value)</small></label>
          <input type="number" name="systolic" class="form-control" required min="50" max="250" placeholder="e.g. 120">
        </div>
        <div class="col">
          <label class="form-label">Diastolic BP <small>(lower value)</small></label>
          <input type="number" name="diastolic" class="form-control" required min="30" max="150" placeholder="e.g. 80">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">BMI <small>(e.g. 22.5)</small></label>
        <input type="number" name="bmi" class="form-control" step="0.1" required min="10" max="60" placeholder="e.g. weight(kg)/height(m)^2">
      </div>

      <div class="mb-3">
        <label class="form-label">Glucose Level <small>(mg/dL)</small></label>
        <input type="number" name="glucose" class="form-control" required min="50" max="500" placeholder="e.g. 110">
      </div>

      <div class="mb-3">
        <label class="form-label">SpO₂ Level <small>(% oxygen saturation)</small></label>
        <input type="number" name="spo2" class="form-control" required min="70" max="100" placeholder="e.g. 98">
      </div>

      <div class="mb-3">
        <label class="form-label">Pulse Rate <small>(beats per minute)</small></label>
        <input type="number" name="pulse" class="form-control" required min="30" max="200" placeholder="e.g. 72">
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-success">✅ Submit New Health Data</button>
        <a href="/dashboard" class="btn btn-secondary">⬅️ Back to Dashboard</a>
      </div>
    </form>
  </div>
</body>
</html>
